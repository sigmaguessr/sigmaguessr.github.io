<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>SigmaGuessr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <script src="game.js"></script>
    <script src="index.js"></script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="multiplayer.js"> </script>
  </head>
  <body>
        <!-- IN GAME -->
    <div class="score" id="score"> 0 Points</div>
    <div class=mapctnr>
    <iframe
      id="MainMap"
      class="mainmap"
      src=""
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    </div>
    <div class="guessctnr">
<div id="map" class="LocationPick"></div>
<button onclick = "submitScore()" id="guessbtn">Guess</button>
    </div>

    <!-- RESULT SCREEN-->
    <div class="resultsScreen" id="resultsScreen"> 
      <p id="resultText"></p>
<button onclick="nextLocation()" id="nextButton">Next</button>

    </div>
    <div class="result" id="result"> </div>


    <!-- MENU-->
     <div id="menuDiv">
      <img class="menuBg" id="menuBg" src="https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Zm9yZXN0JTIwd2FsbHBhcGVyfGVufDB8fDB8fHww">
      <div class="menuButtonBar">
      <h1> Sigmaguessr</h1>


      <button class="menuButton" onclick="startGame('s')"> Singleplayer</button>
      <hr>
      <button class="menuButton" onclick="startGame('h')"> Create Party</button>
      <button class="menuButton" > Join Party</button>
      </div>
    </div>
    <!-- Multiplayer Menu-->
      <div class="multiplayerPanel" id="multiplayerPanel"> 
        <div class="gameCodeHeading">
          <p class="smallText">Game Code:</p>
          <p class="gameCode">367679</p>

            <p>Players:</p>
          <div class="playerBox">
            hello
          </div>
        </div>
      </div>
<script src="mapConfig.js"></script>
<script src="mapFunctions.js"> </script>
  </body>
</html>
